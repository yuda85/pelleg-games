<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>פֶּלֶגֵ'ימְס</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EEF6FF" />
    <meta name="description" content="משחקים לימודיים בעברית לילדים" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="פֶּלֶגֵ'ימְס" />
    <!--
      Theme, before first paint. Angular boots too late to set this without a
      flash of the wrong colours, so the stored choice is applied here and the
      Theme service picks up the same attribute afterwards. No stored choice
      leaves the attribute off, and the stylesheet's media query answers.
    -->
    <script>
      (function () {
        try {
          var choice = localStorage.getItem('pelegames.theme.v1');
          if (choice === 'dark' || choice === 'light') {
            document.documentElement.setAttribute('data-theme', choice);
          }
          var dark =
            choice === 'dark' ||
            (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#12132A' : '#EEF6FF');
          if (localStorage.getItem('pelegames.motion.v1') === 'still') {
            document.documentElement.setAttribute('data-motion', 'still');
          }
        } catch (e) {
          /* Private browsing: the app still boots, on the device preference. */
        }
      })();
    </script>
  </head>
  <body>
    <pg-root></pg-root>
    <noscript>כְּדֵי לְשַׂחֵק צָרִיךְ לְהַפְעִיל JavaScript בַּדַּפְדְּפָן.</noscript>
  </body>
</html>
